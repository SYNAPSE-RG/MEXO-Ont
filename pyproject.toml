[project]
name = "mexo-kg"
version = "0.2.0"
description = "MEXO knowledge graph builder with RDF, SPARQL and GraphML/GEXF exports"
requires-python = ">=3.10"
dependencies = ["pandas", "openpyxl", "rdflib", "pyshacl", "streamlit", "fastapi", "uvicorn", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mexo-kg = "mexo_kg.cli:main"
